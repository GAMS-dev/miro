title = "GAMS MIRO betterleaks config"

[extend]
useDefault = true

[[rules]]
id = "gams-access-code"
description = "GAMS access code"
regex = '''(?:^|[^0-9A-Za-z])([0-9A-Za-z]{8}-[0-9A-Za-z]{4}-[0-9A-Za-z]{4}-[0-9A-Za-z]{4}-[0-9A-Za-z]{12})(?:[^0-9A-Za-z]|$)'''
filter = '''
finding["secret"] in [
    "11111111-2222-3333-4444-555555555555",
    "66666666-7777-8888-9999-000000000000",
    "18a66f5f-dbdf-4c17-9dd7-1634712a9cbe",
    "70ad2c3b-761f-4aa9-a9de-e7405aa2b4c1",
]
'''
