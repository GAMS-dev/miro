<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4"
  lang="en"
>
  <head>
    <title th:text="${title}"></title>

    <!-- Meta -->
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="GAMS MIRO Server" />
    <meta name="author" content="GAMS Development Corp." />
    <link rel="shortcut icon" th:href="@{${resourcePrefix} + '/favicon'}" />

    <link
      rel="stylesheet"
      media="screen"
      th:href="@{${resourcePrefix} + '/css/default.css'}"
    />
    <link
      rel="stylesheet"
      media="screen"
      th:href="@{${resourcePrefix} + ${bootstrapCss}}"
    />
    <link
      rel="stylesheet"
      media="screen"
      th:href="@{${resourcePrefix} + ${themeCss}}"
    />
    <link
      rel="stylesheet"
      media="screen"
      th:href="@{${resourcePrefix} + '/assets/css/styles.css'}"
    />
    <script th:src="@{${resourcePrefix} + ${jqueryJs}}"></script>
  </head>

  <body>
    <div class="site-wrapper d-flex flex-column min-vh-100">
      <!-- ******Header****** -->
      <div th:replace="~{fragments/navbar :: navbar}"></div>

      <main
        class="container flex-grow-1 mt-5"
        th:with="visibleApps=${apps != null ? apps.?[id != 'admin'] : T(java.util.Collections).emptyList()}"
      >
        <div
          class="app-wrapper row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xxl-4 g-4"
          th:if="${!#lists.isEmpty(visibleApps)}"
        >
          <div
            class="col"
            th:each="app: ${visibleApps}"
            th:if="${app.id != 'admin'}"
          >
            <div
              class="app-box launch-app-box app-box-fixed-height"
              th:data-launch-url="@{/app/}+${app.id}"
              role="button"
              tabindex="0"
            >
              <div class="d-flex flex-column">
                <!-- Logo -->
                <div class="app-logo-wrapper">
                  <div
                    class="app-logo"
                    th:style="'background:url(\'' + @{${resourcePrefix} + '/assets/logos/' + ${app.logoURL}} + '\') no-repeat;background-size:cover'"
                    aria-hidden="true"
                  ></div>
                </div>

                <!-- Text -->
                <div style="height: 125px">
                  <h3
                    class="app-title app-title-fixed app-item-title"
                    style="margin-top: 15pt"
                    th:title="${app.displayName == null} ? ${app.id} : ${app.displayName}"
                    th:text="${app.displayName == null} ? ${app.id} : ${app.displayName}"
                  ></h3>
                  <p
                    class="app-desc app-desc-fixed app-item-desc"
                    th:if="${app.description != null}"
                    th:text="${app.description}"
                  ></p>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div
          id="noAppsInfo"
          class="no-apps-container"
          th:if="${#lists.isEmpty(visibleApps)}"
        >
          <h3>No apps</h3>
          <p class="text-body-secondary mb-3">
            When apps are added to your workspace, they'll show up here.
          </p>
          <a
            th:if="${isAdmin}"
            th:href="@{/app/}+'admin'"
            class="btn btn-primary btn-sm"
            >Open Admin Panel</a
          >
        </div>
      </main>
    </div>
    <script
      type="text/javascript"
      th:src="@{${resourcePrefix} + '/assets/js/main.js'}"
    ></script>
    <script th:src="@{${resourcePrefix} + ${bootstrapJs}}"></script>
  </body>
</html>
