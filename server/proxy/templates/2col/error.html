<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4"
  lang="en"
>
  <head lang="en">
    <title>Error</title>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="GAMS MIRO Server" />
    <meta name="author" content="GAMS Development Corp." />

    <link rel="shortcut icon" th:href="@{${resourcePrefix} + '/favicon'}" />
    <link
      rel="stylesheet"
      media="screen"
      th:href="@{${resourcePrefix} + ${bootstrapCss}}"
    />
    <link
      id="theme-style"
      rel="stylesheet"
      th:href="@{${resourcePrefix} + ${themeCss}}"
    />
    <link
      rel="stylesheet"
      media="screen"
      th:href="@{${resourcePrefix} + '/assets/css/styles.css'}"
    />
  </head>

  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="site-wrapper">
      <section
        class="cards-section text-center min-vh-100 d-flex align-items-center"
      >
        <div class="container">
          <h2 class="title">Error</h2>
          <div id="error">
            <p>Oops. An error has occurred. Please try again later.</p>
            <p><a class="btn btn-secondary" th:href="@{/}">Home</a></p>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
