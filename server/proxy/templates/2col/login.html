<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4"
  lang="en"
>
  <head>
    <title th:text="${title}"></title>

    <!-- Meta -->
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="GAMS MIRO Server" />
    <meta name="author" content="GAMS Development Corp." />

    <link rel="shortcut icon" th:href="@{${resourcePrefix} + '/favicon'}" />
    <link
      rel="stylesheet"
      media="screen"
      th:href="@{${resourcePrefix} + ${bootstrapCss}}"
    />
    <link
      id="theme-style"
      rel="stylesheet"
      th:href="@{${resourcePrefix} + ${themeCss}}"
    />
    <link
      rel="stylesheet"
      media="screen"
      th:href="@{${resourcePrefix} + '/assets/css/styles.css'}"
    />
  </head>

  <body>
    <div class="site-wrapper">
      <!-- Header -->
      <header class="sub-header text-center">
        <div class="container">
          <div class="branding">
            <h1 class="logo">
              <img
                class="img-fluid"
                th:src="@{${resourcePrefix} + ${logoPath}}"
                alt="Logo"
              />
            </h1>
          </div>
          <div class="tagline"></div>
        </div>
      </header>

      <!-- Login section -->
      <section class="cards-section text-center">
        <div class="container">
          <form
            class="form-signin"
            th:action="@{/login}"
            method="POST"
            novalidate
          >
            <h2 class="form-signin-heading">Please sign in</h2>
            <div class="alert alert-danger" th:if="${error}">
              <strong>Could not sign in!</strong><br />
              <span th:text="${error}"></span>
            </div>
            <label for="username" class="form-label visually-hidden"
              >Username</label
            >
            <input
              name="username"
              id="username"
              class="form-control"
              placeholder="User name"
              required
              autofocus
            />
            <label for="password" class="form-label visually-hidden"
              >Password</label
            >
            <input
              name="password"
              type="password"
              id="password"
              class="form-control"
              placeholder="Password"
              required
            />
            <button
              class="btn btn-primary btn-lg w-100 btn-login"
              type="submit"
            >
              Sign in
            </button>
          </form>
        </div>
      </section>
    </div>
  </body>
</html>
