<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4"
  lang="en"
>
  <head lang="en">
    <title th:text="${title}"></title>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="GAMS MIRO Server" />
    <meta name="author" content="GAMS Development Corp." />
    <link rel="shortcut icon" th:href="@{${resourcePrefix} + '/favicon'}" />

    <link
      rel="stylesheet"
      media="screen"
      th:href="@{${resourcePrefix} + ${bootstrapCss}}"
    />
    <link
      rel="stylesheet"
      media="screen"
      th:href="@{${resourcePrefix} + ${themeCss}}"
    />
    <link
      rel="stylesheet"
      media="screen"
      th:href="@{${resourcePrefix} + '/assets/css/styles.css'}"
    />
  </head>

  <body>
    <div class="text-center d-flex h-100 auth-page">
      <main class="form-signin m-auto">
        <img
          class="auth-logo p-4 mb-4 rounded w-100"
          th:src="@{${resourcePrefix} + ${logoPath}}"
          alt="Logo"
        />
        <h1 class="h3 mb-3 fw-normal">
          You have been logged out successfully!
        </h1>
        <div class="d-grid gap-2">
          <a class="btn btn-lg btn-primary" th:href="@{/}">Login again</a>
        </div>
      </main>
    </div>
  </body>
</html>
