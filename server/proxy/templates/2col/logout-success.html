<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4"
  lang="en"
>
  <head lang="en">
    <title th:text="${title}"></title>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="GAMS MIRO Server" />
    <meta name="author" content="GAMS Development Corp." />
    <link rel="shortcut icon" th:href="@{${resourcePrefix} + '/favicon'}" />

    <link
      rel="stylesheet"
      media="screen"
      th:href="@{${resourcePrefix} + ${bootstrapCss}}"
    />
    <link
      rel="stylesheet"
      media="screen"
      th:href="@{${resourcePrefix} + ${themeCss}}"
    />
    <link
      rel="stylesheet"
      media="screen"
      th:href="@{${resourcePrefix} + '/assets/css/styles.css'}"
    />
  </head>

  <body>
    <div class="site-wrapper">
      <header class="sub-header text-center py-4">
        <div class="container">
          <div class="branding">
            <h1 class="logo">
              <img
                class="img-fluid"
                th:src="@{${resourcePrefix} + ${logoPath}}"
                alt="Logo"
              />
            </h1>
          </div>
          <div class="tagline"></div>
        </div>
      </header>

      <section class="cards-section text-center">
        <div class="container">
          <h2 class="form-signin-heading">
            You have been logged out successfully!
          </h2>
          <a class="btn btn-primary btn-lg w-100 w-sm-auto mt-2" th:href="@{/}"
            >Login again</a
          >
        </div>
      </section>
    </div>
  </body>
</html>
