<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4"
>
  <head></head>
  <body>
    <div th:fragment="navbar" th:if="${showNavbar}" id="navbar">
      <nav class="navbar navbar-inverse navbar-fixed-top">
        <div class="navbar-header">
          <button
            type="button"
            class="navbar-toggle collapsed"
            data-toggle="collapse"
            data-target="#mainNavbar"
            aria-expanded="false"
          >
            <span class="sr-only">Toggle navigation</span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
          </button>
          <a
            id="navHome"
            class="navbar-brand navbar-nav active"
            th:href="@{/}"
          >
            My Apps
          </a>
        </div>
        <div class="container-fluid collapse navbar-collapse" id="mainNavbar">
          <ul class="nav navbar-nav" th:if="${isAdmin}">
            <li>
              <a id="navAdminPanel" th:href="@{/app/}+'admin'">Admin Panel</a>
            </li>
          </ul>
          <ul
            class="nav navbar-nav navbar-right navbar-user"
            sec:authorize="isAuthenticated()"
          >
            <li class="dropdown">
              <a
                href="#"
                class="dropdown-toggle"
                data-toggle="dropdown"
                role="button"
                aria-haspopup="true"
                aria-expanded="false"
              >
                <span class="user-name" sec:authentication="name">User</span>
                <span class="caret"></span>
              </a>
              <ul class="dropdown-menu dropdown-menu-right user-menu">
                <li>
                  <a href="https://gams.com/miro/" target="_blank">Help</a>
                </li>
                <li role="separator" class="divider"></li>
                <li><a th:href="@{/logout}">Sign Out</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </nav>
    </div>
  </body>
</html>
