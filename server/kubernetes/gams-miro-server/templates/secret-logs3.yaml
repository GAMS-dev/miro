{{- if eq .Values.proxy.config.containerLogBackend.type "s3" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}-secls3
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.global.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.global.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.global.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  secretAccessKey: {{ required "secrets.containerLogS3SecretAccessKey is required if proxy.config.containerLogBackend.type is 's3'" .Values.secrets.containerLogS3SecretAccessKey | quote }}
{{- end }}
