rootPath: '/'

global:
  # Global Docker image registry
  imageRegistry: ''
  # imagePullSecrets:
  #   - registryKeySecretName
  # Global tag of the images. If not specified, AppVersion is used.
  imageTag: ''
  imagePullSecrets: []
  # nodeSelector: Node labels for pod assignment
  nodeSelector: {}
  # tolerations: tolerations for pod assignment
  tolerations: []
  # nodeSelector: Node labels for pod assignment of stateful sets (database)
  nodeSelectorSts: {}
  # tolerationsSts: tolerations for pod assignment of stateful sets (database)
  tolerationsSts: []
  networkPolicy:
    enabled: false
    # The IP adress of the Kubernetes API Server.
    # kubectl get svc kubernetes -n default -o jsonpath='{.spec.clusterIP}'
    apiServerIp: ''
  securityContext:
    enabled: true
  # Labels to add to all deployed resources
  commonLabels: {}
  # Annotations to add to all deployed resources
  commonAnnotations: {}

secrets:
  dbPassword: ''
  oidcClientSecret: ''
  engineAnonymousPassword: ''
  containerLogS3SecretAccessKey: ''
  redisPassword: ''

proxy:
  image:
    registry: docker.io/gams
    repository: miro-proxy
    tag: ''
  resources:
    requests:
      cpu: '200m'
      memory: 500Mi
    limits:
      cpu: '2000m'
      memory: 750Mi
  service:
    type: ClusterIP # ClusterIP or NodePort
    # only relevant if type is NodePort. If not provided, a random port within the NodePort range is used.
    nodePort: ''
    annotations: {}
  networkPolicy:
    allowEgressPublicNetworks: true
    # Add extra ingress rules to the NetworkPolicy
    # (only relevent if global.networkPolicy.enabled is true)
    # Example:
    #   - ports:
    #     - protocol: TCP
    #       port: 9090
    #   from:
    #     - namespaceSelector:
    #         matchLabels:
    #           name: monitoring
    #     - podSelector:
    #         matchLabels:
    #           app: prometheus
    extraIngress: []
  podAnnotations: {}
  config:
    title: GAMS MIRO Server
    language: en # en, de or cn
    colorTheme: default
    maxTotalInstances: -1 # -1 for unlimited
    proxyMaxLifetimeMinutes: -1 # -1 for unlimited
    maxUploadSizeMB: 200
    forceSignedApps:
      enabled: false
      acceptedPublicKeysPEM: []
    logo: '' # base64-encoded logo
    favicon: '' # base64-encoded favicon
    customTheme: '' # base64-encoded custom CSS theme. "colorTheme" must be set to "custom"
    containerLogBackend:
      type: none # Container log backed. Currently supported none (disabled) or s3
      s3:
        # NOTE: secrets.containerLogS3SecretAccessKey must be provided!
        bucketName: '' # Name of the s3 bucket
        bucketDir: '/' # Path to directory where log files are to be stored
        region: '' # AWS region e.g. us-east-1
        accessKeyId: '' # AWS access key ID
    disableReadonlyMode: false
    anonymousReadonlyMode: false
    containerWaitTimeSeconds: 300
    containerPullPolicy: IfNotPresent # For UI/Admin images: IfNotPresent, Always or Never
    security:
      sameSiteCookie: Lax # Lax or Strict. Change this only if you are aware of the consequences
      xFrameOptionsHeader: sameorigin # sameorigin, disable or allow-from https://example.com
      secureCookies: true
    authentication: password # password, openid or none
    openid:
      # NOTE: secrets.oidcClientSecret must be provided!
      authUrl: ''
      tokenUrl: ''
      jwksUrl: ''
      logoutUrl: ''
      clientId: ''
      scopes: '' # "openid,email" are always requested. Only add additional scopes (e.g. profile) here
      withPKCE: false
    engine:
      apiUrl: ''
      namespace: ''
      anonymousUser: '' # only relevant if authentication is none
      anonymousAdminUser: '' # only relevant if authentication is none
      # NOTE: secrets.engineAnonymousPassword must be provided if anonymousUser is set!
    metrics:
      enabled: false
      # Specifies whether a serviceMonitor object should be created. Requires Prometheus Operator CRDs.
      # Requires metrics to be enabled.
      serviceMonitorEnabled: false
      # configures a custom realm label to be exposed in the metrics
      # (only relevant when serviceMonitorEnabled is true)
      realm: default
      port: 9090
    persistentSessionStore:
      # secrets.redisPassword must be provided if persistentSessionStore is set.
      host: ''
      port: ''
      user: ''
      sslEnabled: true # if AWSelastiCache is used ssl should be enabled.
      disableConfigureAction: true # if AWSelastiCache is used it should be true.

auth:
  image:
    registry: docker.io/gams
    repository: miro-auth
    tag: ''
  resources:
    requests:
      cpu: '200m'
      memory: 500Mi
    limits:
      cpu: '2000m'
      memory: 750Mi
  service:
    type: ClusterIP # ClusterIP or NodePort
    # only relevant if type is NodePort. If not provided, a random port within the NodePort range is used.
    nodePort: ''
    annotations: {}
  networkPolicy:
    allowEgressPublicNetworks: true
    # Add extra ingress rules to the NetworkPolicy
    # (only relevent if global.networkPolicy.enabled is true)
    # Example:
    #   - ports:
    #     - protocol: TCP
    #       port: 9090
    #   from:
    #     - namespaceSelector:
    #         matchLabels:
    #           name: monitoring
    #     - podSelector:
    #         matchLabels:
    #           app: prometheus
    extraIngress: []
    extraEgress: []
  podAnnotations: {}

miro:
  image:
    registry: docker.io/gams
    repository: miro-ui
    tag: ''
  resources:
    requests:
      cpu: '450m'
      memory: 1700Mi
    limits:
      cpu: '2000m'
      memory: 1700Mi
  networkPolicy:
    allowEgressPublicNetworks: true
    # Add extra egress rules to the NetworkPolicy
    # (only relevent if global.networkPolicy.enabled is true)
    extraEgress: []
  podAnnotations: {}

admin:
  image:
    registry: docker.io/gams
    repository: miro-admin
    tag: ''
  resources:
    requests:
      cpu: '450m'
      memory: 1700Mi
    limits:
      cpu: '2000m'
      memory: 1700Mi
  podAnnotations: {}

db:
  image:
    registry: docker.io
    repository: postgres
    tag: '17-alpine'
  externalHost: '' # if not specified, a statefulset will be created
  port: 5432
  user: 'GMSMASTER'
  # NOTE: secrets.dbPassword must be provided!
  name: 'gamsmiro'
  volumeSize: 5Gi
  resources:
    requests:
      cpu: '100m'
      memory: 1024Mi
    limits:
      cpu: '400m'
      memory: 3072Mi
  podAnnotations: {}

persistence:
  type: 'local' # local or efs
  efs:
    fileSystemId: 'fs-12345678' # The EFS File System ID
    accessPointId: '' # Optional, for EFS Access Points
    storageClass: 'efs-sc' # EFS storage class. NOTE: You need to manually install this storage class in the cluster!
    mountTargets: [] # relevant if global.networkPolicy.enabled is "true"
  local:
    path: '/mnt/localstorage'

ingress:
  enabled: false
  annotations: {}
  className: ''
  tls: false
  tlsSecretName: ''
  hostname: example.com
