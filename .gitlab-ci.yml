  stage: deploy
  before_script:
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '#!/bin/sh\necho "$SSH_PRIVATE_KEY_GAMSCOM_STAGING_PASSPHRASE"' > ~/.ssh/.print_ssh_password
    - chmod 700 ~/.ssh/.print_ssh_password
    - chmod +x ~/.ssh/.print_ssh_password
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY_GAMSCOM_STAGING" | tr -d '\r' | DISPLAY=":0.0" SSH_ASKPASS=~/.ssh/.print_ssh_password setsid ssh-add - > /dev/null
  script:
    - rsync -Orlptvz doc/* staging@gams.com:/var/www/html/staging.gams.com/public_html/miro
  rules:
    - if: $CI_MERGE_REQUEST_ID
      when: always
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always
    - when: manual
    - allow_failure: true
  needs: []


niteni-code-review:
  stage: review
  tags:
    - linux
  variables:
    GEMINI_MODEL: gemini-3.5-flash
  cache:
    key: niteni-fork-cache
    paths:
      - .niteni-local/
  script:
    - |
      if [ ! -d ".niteni-local/node_modules" ]; then
        echo "Cache miss! Fetching and building the fork..."
        git clone https://github.com/denyherianto/gitlab-ai-code-review.git /tmp/niteni
        cd /tmp/niteni
        git checkout beab6669a0436deaa9af79c0bd8a83bcdd311bc8

        # Install all dependencies and compile the TypeScript/Build step
        npm ci
        npm run build --if-present

        # Move everything into the project directory so GitLab can cache it for next time
        mkdir -p $CI_PROJECT_DIR/.niteni-local
        cp -r node_modules package.json $CI_PROJECT_DIR/.niteni-local/

        # Copy over compiled build files or source files depending on what they use
        [ -d "dist" ] && cp -r dist $CI_PROJECT_DIR/.niteni-local/
        [ -d "bin" ] && cp -r bin $CI_PROJECT_DIR/.niteni-local/
        [ -d "src" ] && cp -r src $CI_PROJECT_DIR/.niteni-local/
        cd $CI_PROJECT_DIR
      else
        echo "Cache hit! Using cached build."
      fi
    - node .niteni-local/dist/cli.js --mode mr
  allow_failure: true
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
