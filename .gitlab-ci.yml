upload_cloudfront:
  tags:
    - linux
  stage: deploy
  image: $CI_REGISTRY_IMAGE/builder-linux:latest
  id_tokens:
    ID_TOKEN:
      aud: https://git.gams.com
  script:
    - *assume_role_s3
    - echo "MIRO_SHA_HASH_WIN=`sha256sum dist/*.exe |cut -d ' ' -f1`" > .hashes.txt
    - echo "MIRO_SHA_HASH_MAC_ARM=`sha256sum dist/arm/*.dmg |cut -d ' ' -f1`" >> .hashes.txt
    - echo "MIRO_SHA_HASH_MAC_X86=`sha256sum dist/*.dmg |cut -d ' ' -f1`" >> .hashes.txt
    - echo "MIRO_SHA_HASH_LINUX=`sha256sum dist/*.AppImage |cut -d ' ' -f1`" >> .hashes.txt
    - echo "MIRO_SHA_HASH_DEB_LINUX=`sha256sum dist/*.deb |cut -d ' ' -f1`" >> .hashes.txt
    - ./ci/s3_upload_artifacts.sh
  artifacts:
    paths:
      - .hashes.txt
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: on_success

upload_dockerhub:
  tags:
    - linux
  stage: deploy
  services:
    - docker:29-dind
  image: $CI_REGISTRY_IMAGE/builder-linux:latest
  id_tokens:
    ID_TOKEN:
      aud: https://git.gams.com
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_VERIFY: 1
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_CERT_PATH: '/certs/client'
    DOCKER_HOST: tcp://docker:2376
  before_script:
    - echo "$DOCKERHUB_PASS" | docker login -u $DOCKERHUB_USER --password-stdin
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - aws configure set default.region us-east-1
    - *assume_role_ecr
    - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REGISTRY_URL_US_EAST
  script:
    - echo -e "\e[0Ksection_start:`date +%s`:download_image_section[collapsed=true]\r\e[0KDownloading images section"
    - cd server && python3 miro_server.py download ${CI_REGISTRY_IMAGE} && cd ..
    - echo -e "\e[0Ksection_end:`date +%s`:download_image_section\r\e[0K"
    - >
      pushd server
        echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
        python3 miro_server.py push
        python3 miro_server.py push --registry "${ECR_REGISTRY_URL_US_EAST}"
      popd
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: on_success

upload_helm_chart:
  tags:
    - linux
  image: $CI_REGISTRY_IMAGE/gamsmiro-server-ci:latest
  id_tokens:
    ID_TOKEN:
      aud: https://git.gams.com
  stage: deploy
  variables:
    CHART_DIR: 'server/kubernetes/gams-miro-server'
  before_script:
    - aws configure set default.region us-east-1
    - *assume_role_s3_helm
    - echo "$HELM_GPG_PRIVATE_KEY_ARMOR" > /tmp/priv.asc
    - export GNUPGHOME="${CI_PROJECT_DIR}/.gnupg"
    - mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
    - gpg --batch --import /tmp/priv.asc
    - echo -e "5\ny\n" | gpg --command-fd 0 --expert --batch --edit-key "$HELM_GPG_KEY_FPR" trust quit
    - gpg --export > "${GNUPGHOME}/pubring.gpg"
    - gpg --export-secret-keys --pinentry-mode loopback --passphrase "$HELM_GPG_PASSPHRASE" > "${GNUPGHOME}/secring.gpg"
    - gpg --list-secret-keys --keyid-format LONG
  script:
    - helm dependency update "$CHART_DIR" || true
    - helm lint "$CHART_DIR" || true
    - echo -n "$HELM_GPG_PASSPHRASE" > /tmp/helm-passphrase.txt
    - chmod 600 /tmp/helm-passphrase.txt
    - |
      helm package --sign "$CHART_DIR" \
        --key "${HELM_GPG_KEY_NAME}" \
        --keyring "${GNUPGHOME}/secring.gpg" \
        --passphrase-file /tmp/helm-passphrase.txt
    - |
      for f in ./*.tgz ./*.tgz.prov; do
        [ -f "$f" ] || continue;
        echo "Uploading $f";
        aws s3 cp "$f" "s3://${HELM_REPO_S3_BUCKET}/" \
          --cache-control "public, max-age=31536000, immutable" \
          --only-show-errors;
      done
    - ./ci/update-helm-index.sh
  artifacts:
    paths:
      - '*.tgz'
      - '*.tgz.prov'
      - index.yaml
    expire_in: 1 week
  dependencies: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: on_success

