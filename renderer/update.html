<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self';" />
    <meta name="color-scheme" content="dark light" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="../node_modules/@fortawesome/fontawesome-free/css/all.min.css"
    />
    <link id="theme-style" rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="site-wrapper update-wrapper">
      <img class="about-logo" src="../static/icon_64x64.png" alt="" />
      <i id="updateSpinner" class="fas fa-spinner fa-pulse"></i>
      <div id="updateText"></div>
      <div id="updateDetail"></div>
      <div class="update-actions">
        <button id="btClose" class="btn btn-secondary confirm-btn">Ok</button>
        <button id="btUpdate" class="btn confirm-btn" style="display: none">
          Update
        </button>
      </div>
    </div>
    <script type="text/javascript" src="./update.js"></script>
    <script
      type="text/javascript"
      src="../node_modules/@fortawesome/fontawesome-free/js/all.js"
    ></script>
  </body>
</html>
